# 开发环境配置
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/loan?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:1234}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      pool-name: LoanMsHikariPool

# 文件上传存储目录
upload:
  dir: uploads/

# JWT 认证配置
jwt:
  secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc3Ryb25nLWFuZC1yYW5kb20tc2VjcmV0LWtleS1mb3Itand0LWhzMjU2LWFsZ29yaXRobS1pbi1sb2FuLW1zLXRlc3QtZW52aXJvbm1lbnQ=}
  expiration: 7200000  # 2小时

# SpringDoc OpenAPI 配置（开发环境启用）
springdoc:
  swagger-ui:
    path: /doc.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.young.controller

# 日志配置
logging:
  level:
    com.young: DEBUG
    org.springframework: INFO

# CORS 配置
cors:
  allowed-origins: http://localhost:5173,http://127.0.0.1:5173