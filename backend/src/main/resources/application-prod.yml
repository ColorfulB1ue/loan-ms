# 生产环境配置
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/loan?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

# 文件上传存储目录（生产环境建议使用绝对路径或对象存储）
upload:
  dir: ${UPLOAD_DIR:/data/loan-ms/uploads/}

# JWT 认证配置（生产环境必须通过环境变量注入）
jwt:
  secret: ${JWT_SECRET}
  expiration: 7200000  # 2小时

# SpringDoc OpenAPI 配置（生产环境禁用）
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 日志配置
logging:
  level:
    com.young: INFO
    org.springframework: WARN

# CORS 配置（生产环境配置实际域名）
cors:
  allowed-origins: ${CORS_ORIGINS:https://your-domain.com}

# Actuator 监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
