spring:
  application:
    name: loan-ms
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB
  web:
    resources:
      static-locations:
        - classpath:/META-INF/resources/
        - classpath:/resources/
        - classpath:/static/
        - classpath:/public/
        - classpath:/uploads/

mybatis:
  mapper-locations: classpath:com/young/mapper/*.xml
  configuration:
    # 驼峰命名
    map-underscore-to-camel-case: true
    # 开启二级缓存
    cache-enabled: true

# 服务器配置
server:
  port: ${SERVER_PORT:8080}
  tomcat:
    max-threads: 200
    min-spare-threads: 20

# Actuator 监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
